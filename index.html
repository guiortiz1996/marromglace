<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marrom Glacê Buffet · Orçamento de evento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#FFFFFF;--ink:#2B211C;--mut:#6E625A;--line:#E2D9CC;--acc:#B5652B;--accbg:#FBF0E6;--warn:#8A5A0B;--warnbg:#FBF1DC;--err:#B3261E;--ok:#3B7A3A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.logo{display:block;width:100%;max-width:560px;margin:0 auto 6px;border-radius:12px}
h1{font-family:'Lora',serif;font-weight:500;font-size:22px;text-align:center;margin:8px 0 4px}
.intro{text-align:center;color:var(--mut);font-size:14px;margin:0 0 14px}
.bar{height:5px;background:var(--line);border-radius:5px;margin:6px 0 14px}.bar div{height:5px;background:var(--acc);border-radius:5px;transition:width .3s}
.stp{font-size:13px;color:var(--mut);text-align:center}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.tt{font-family:'Lora',serif;font-size:19px;font-weight:500}
.lb{font-size:13px;color:var(--mut);margin:12px 0 4px;display:block}
input,select{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font:inherit;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.op{display:block;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;font-size:15px}
.op.on{border:2px solid var(--acc);background:var(--accbg);padding:11px}
.op b{font-weight:600}
.sm{font-size:13px;color:var(--mut);line-height:1.5}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ck{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:6px 0;cursor:pointer}
.ck input{width:18px;height:18px;margin-top:2px;accent-color:var(--acc);flex:none}
.er{font-size:13px;color:var(--err);margin-top:8px}
.wa{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.sub{border-left:3px solid var(--acc);padding:2px 0 6px 14px;margin:2px 0 12px}
.ht{font-weight:600;font-size:15px;margin-top:14px}
.nav{display:flex;justify-content:space-between;margin-top:14px;gap:10px}
button{font:inherit;font-weight:600;border-radius:10px;padding:11px 18px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.rw{padding:3px 0;font-size:15px}.rw span{color:var(--mut);font-size:13px;display:block}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:20px}
</style>
</head>
