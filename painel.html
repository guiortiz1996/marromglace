<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marrom Glacê · Painel de orçamentos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3EFE6;--card:#fff;--ink:#2B211C;--mut:#6E625A;--line:#E2D9CC;--acc:#B5652B;--acc2:#8C4A1C;--accbg:#FBF0E6;--warn:#8A5A0B;--warnbg:#FBF1DC;--err:#B3261E;--errbg:#FCEBEA;--ok:#2F6B2E;--okbg:#E7F2E4;--blue:#1F5A8C;--bluebg:#E6F0F9;--wa:#1F8F4E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topin{max-width:1420px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:8px 14px}
.topin img{height:44px;border-radius:6px}
.brand{font-family:'Lora',serif;font-weight:600;font-size:17px;line-height:1.2}
.brand small{display:block;font-family:'Nunito Sans';font-weight:400;font-size:12px;color:var(--mut)}
.user{margin-left:auto;font-size:13px;color:var(--mut);text-align:right}
.tabs{max-width:1420px;margin:0 auto;display:flex;gap:4px;padding:0 10px;overflow-x:auto}
.tab{padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600;color:var(--mut);font-size:14px}
.tab.on{color:var(--acc2);border-color:var(--acc)}
.tab .n{background:var(--acc);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px;margin-left:4px}
main{max-width:1420px;margin:0 auto;padding:16px 18px 60px}
h2{font-family:'Lora',serif;font-weight:600;font-size:22px;margin:4px 0 12px}
h3{font-family:'Lora',serif;font-weight:600;font-size:17px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--mut)}.kpi .v{font-size:24px;font-weight:700;font-family:'Lora',serif}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:none}.row:hover{background:#FBF8F3}
.row .who{flex:1;min-width:0}.row .who b{display:block}.row .meta{font-size:13px;color:var(--mut)}
.badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-revisar{background:var(--warnbg);color:var(--warn)}.b-enviado{background:var(--bluebg);color:var(--blue)}.b-aprovado{background:var(--okbg);color:var(--ok)}.b-incompleto{background:var(--errbg);color:var(--err)}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px}
.sm{font-size:13px;color:var(--mut);font-family:'Nunito Sans',sans-serif;font-weight:400}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:14px}.kv span{color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:6px 4px;border-bottom:1px solid #F0EAE0;vertical-align:middle}
td.r,th.r{text-align:right}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.qi{width:72px;text-align:right}.pi{width:84px;text-align:right}
.auto{font-size:11px;color:var(--ok);font-weight:700}.man{font-size:11px;color:var(--warn);font-weight:700}
button{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button.pri:hover{background:var(--acc2)}
button.wa{background:var(--wa);border-color:var(--wa);color:#fff}
button.lnk{border:none;background:none;color:var(--acc2);padding:4px;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:4px 0;font-size:14px}.tot.big{font-size:20px;font-weight:700;font-family:'Lora',serif;border-top:2px solid var(--ink);margin-top:6px;padding-top:8px}
.alert{border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}
.a-warn{background:var(--warnbg);color:var(--warn)}.a-ok{background:var(--okbg);color:var(--ok)}.a-info{background:var(--bluebg);color:var(--blue)}.a-err{background:var(--errbg);color:var(--err)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.flash{background:var(--ink);color:#fff;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare ol{margin:6px 0 0;padding-left:20px;font-size:14px}.compare li{margin:3px 0}
.prop{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;max-width:620px;margin:0 auto;font-size:14px}
.prop img{width:100%;max-width:420px;display:block;margin:0 auto 8px}
.prop h4{font-family:'Lora',serif;font-size:19px;margin:6px 0;text-align:center}
.wabox{background:#E5DDD5;border-radius:12px;padding:14px}
.bubble{background:#DCF8C6;border-radius:10px;padding:10px 12px;max-width:420px;margin-left:auto;font-size:14px;white-space:pre-line}
.mail{border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:14px}.mail .h{background:#F7F4EE;padding:8px 12px;font-size:13px;color:var(--mut)}.mail .b{padding:12px;white-space:pre-line}
.demo{background:var(--accbg);border:1px dashed var(--acc);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--acc2);margin-bottom:12px}
.mob{display:none}.mrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:14px}.mrow>span:first-child{color:var(--mut)}
.chip.off{background:transparent;border:1px dashed #CDBFAE;color:#A89A88}.chip.tg{cursor:pointer;user-select:none}.chip.tg:hover{outline:1px solid #B8652A}.br{display:grid;grid-template-columns:minmax(110px,36%) 1fr 104px;align-items:center;gap:8px;padding:5px 0;font-size:13px}.br:hover{background:var(--accbg)}.bl{color:var(--ink)}.bt{height:12px;background:#F3EDE3;border-radius:0 4px 4px 0;overflow:hidden}.bf{display:block;height:100%;background:var(--acc);border-radius:0 4px 4px 0}.bv{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}.mc{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:6px;border-bottom:1px solid var(--line)}.mcol{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;cursor:default}.mcol:hover .mbars{background:var(--accbg)}.mbars{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:2px;border-radius:4px}.mb{width:38%;max-width:18px;border-radius:4px 4px 0 0;display:block}.mb.r{background:#1F5A8C}.mb.a{background:#B5652B}.ml{font-size:11px;color:var(--mut);margin-top:4px;height:14px}.lg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:8px}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}.lg i.r{background:#1F5A8C}.lg i.a{background:#B5652B}.rxg select,.rxg input{width:100%;display:block;margin-top:3px;box-sizing:border-box}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#F3EDE3;border-radius:16px;padding:2px 9px;font-size:12px;white-space:nowrap;display:inline-block;margin:2px 2px 0 0}
@media(max-width:760px){.desk{display:none}.mob{display:block}.mrow .qi,.mrow .pi{width:80px}.qi{width:54px;padding:6px 4px}.pi{width:62px;padding:6px 4px}table{font-size:13px}td,th{padding:6px 2px}h2{font-size:20px}.topin img{height:36px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.compare{grid-template-columns:1fr}.user{display:none}.hide-m{display:none}.kv{grid-template-columns:96px 1fr}}
.cmd{border:1.5px solid #000;font-family:Arial,Helvetica,sans-serif;color:#000;background:#fff;box-sizing:border-box;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;position:relative}
.cmg{width:100%;border-collapse:collapse;font-size:14px;color:#000}.cmg th,.cmg td{border:1px solid #000;padding:3px 6px;height:20px}.cmg th{text-align:left;font-weight:800;color:#000;font-size:13px;text-transform:none;letter-spacing:0;background:none;white-space:nowrap;width:1%}.cmg td{text-align:center}.cmg td.sm2{font-size:11px}
.cmb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:800;line-height:1.3;padding:10px 12px;gap:6px}
.cms{font-size:.7em;letter-spacing:.5px;border-bottom:2px solid #000;padding-bottom:2px;margin-bottom:4px}.cmx{max-width:100%}.cmo{font-size:12px;font-weight:600;margin-top:8px}
.cmk{position:absolute;right:6px;bottom:4px;font-size:10px;color:#555}
#printArea{display:none}
@media print{@page{size:A4;margin:8mm}body>*:not(#printArea){display:none!important}#printArea{display:grid!important;grid-template-columns:1fr 1fr;grid-auto-rows:140mm;gap:0}.cmd{height:140mm;overflow:hidden;margin:-.75px}}
.topin,.tabs,main{zoom:var(--z,1)}.fz{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:4px;vertical-align:middle}.fz button{border:0;border-radius:0;background:#fff;padding:2px 9px;font-weight:700;color:var(--mut);cursor:pointer;line-height:1.4}.fz button+button{border-left:1px solid var(--line)}.fz button.on{background:var(--acc);color:#fff}
.catt td:first-child{width:30%}.catt .chip{font-size:11px;padding:1px 7px;margin:2px 1px 0 0}
</style>
</head>

const fat=ap.reduce((a,x)=>a+x.tot,0),tk=ap.length?fat/ap.length:0,pp=ap.length?fat/ap.reduce((a,x)=>a+x.pes,0):0,cv=dec.length?ap.length/dec.length:0;

const bt=grp(D,'svk'),tipoRows=Object.keys(bt).map(k=>{const L=bt[k],a=L.filter(x=>x.st==='aprovado'),dd=L.filter(x=>x.st==='aprovado'||x.st==='perdido');return [TIPOS[k][1],a.reduce((s,x)=>s+x.tot,0),`${L.length} pedidos · conversão ${dd.length?pct(a.length/dd.length):'—'}`]}).sort((a,b)=>b[1]-a[1]);
const bo=grp(D,'origem'),orgRows=Object.keys(bo).map(k=>{const L=bo[k],a=L.filter(x=>x.st==='aprovado'),dd=L.filter(x=>x.st==='aprovado'||x.st==='perdido');return [k,L.length,`conversão ${dd.length?pct(a.length/dd.length):'—'}`]}).sort((a,b)=>b[1]-a[1]);
const bm=grp(D,'motivo'),motRows=Object.keys(bm).map(k=>[k,bm[k].length]).sort((a,b)=>b[1]-a[1]).slice(0,6);
const DS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'],diaRows=[1,2,3,4,5,6,0].map(i=>[DS[i],D.filter(x=>x.dia===i).length]);
const FXO=['Até R$ 40','R$ 40 a R$ 70','R$ 70 a R$ 100','Acima de R$ 100','Não sei'],fxRows=FXO.map(f=>[f,D.filter(x=>x.fx===f).length]);
const MN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'],months=[];for(let i=AP-1;i>=0;i--){const d=new Date(2026,10-i,1);months.push([d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),MN[d.getMonth()]+(d.getMonth()===0||i===AP-1?'/'+String(d.getFullYear()).slice(2):'')])}
const mx=Math.max(1,...months.map(m=>D.filter(x=>x.ym===m[0]).length));
const mchart=`<div class="mc">${months.map(m=>{const r=D.filter(x=>x.ym===m[0]),a=r.filter(x=>x.st==='aprovado');return `<div class="mcol" title="${m[1]}: ${r.length} recebidos, ${a.length} aprovados (${brl(a.reduce((s,x)=>s+x.tot,0))})"><div class="mbars"><span class="mb r" style="height:${r.length/mx*100}%"></span><span class="mb a" style="height:${a.length/mx*100}%"></span></div><div class="ml">${m[1]}</div></div>`}).join('')}</div><div class="lg"><span><i class="r"></i>Pedidos recebidos</span><span><i class="a"></i>Aprovados</span><span>Meses recentes ainda têm propostas em aberto.</span></div>`;
const per=[[3,'3 meses'],[6,'6 meses'],[12,'12 meses']].map(([n,l])=>`<span class="chip tg ${AP===n?'':'off'}" style="${AP===n?'background:var(--acc);color:#fff':''}" onclick="AP=${n};render()">${l}</span>`).join('');
const best=tipoRows[0],bestO=orgRows.slice().sort((a,b)=>parseInt(b[2].split(' ')[1])-parseInt(a[2].split(' ')[1]))[0];
return `<div class="demo">Histórico de exemplo, gerado para mostrar o dashboard. Com o sistema em uso, estes números vêm dos pedidos reais.</div>
<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"><h2 style="margin:0">Análises</h2><div class="chips">${per}</div></div>
<div class="kpis" style="grid-template-columns:repeat(5,minmax(0,1fr));margin-top:12px"><div class="kpi"><div class="l">Pedidos recebidos</div><div class="v">${D.length}</div></div><div class="kpi"><div class="l">Taxa de conversão</div><div class="v">${pct(cv)}</div><div class="sm">${ap.length} aprovados de ${dec.length} decididos</div></div><div class="kpi"><div class="l">Faturamento aprovado</div><div class="v" style="font-size:20px">${brl(fat)}</div></div><div class="kpi"><div class="l">Ticket médio</div><div class="v" style="font-size:20px">${brl(tk)}</div></div><div class="kpi"><div class="l">Valor médio por pessoa</div><div class="v" style="font-size:20px">${brl(pp)}</div></div></div>
<div class="alert a-info">${best?`<b>${best[0]}</b> é o serviço que mais faturou no período (${brl(best[1])}). `:''}${bestO?`Pedidos vindos de <b>${bestO[0]}</b> são os que mais fecham (${bestO[2].replace('conversão ','')}).`:''}</div>
<div class="card"><h3>Pedidos por mês</h3>${mchart}</div>
<div class="g2"><div><div class="card"><h3>Faturamento aprovado por tipo de evento</h3>${bars(tipoRows,brl)}</div><div class="card"><h3>Motivo do evento</h3>${bars(motRows,v=>v+' pedidos')}</div><div class="card"><h3>Faixa de investimento informada</h3>${bars(fxRows,v=>v+' pedidos')}</div></div>
<div><div class="card"><h3>De onde vêm os pedidos</h3>${bars(orgRows,v=>v+' pedidos')}</div><div class="card"><h3>Dia da semana dos eventos</h3>${bars(diaRows,v=>v+' eventos')}</div></div></div>`}
function rgSet(k,v){RG[k]=+v||0;rgSave();flash='Regra atualizada. Orçamentos pendentes recalculados.';render()}
function entSet(i,k,v){ENT[i][k]=k==='v'?(+v||0):v.trim();rgSave();flash='Taxa de entrega atualizada. Orçamentos pendentes recalculados.';render()}
function entAdd(){ENT.push({c:'Piracicaba',b:'',v:0});rgSave();render()}
function entDel(i){const n=ENT[i].c+(ENT[i].b?' · '+ENT[i].b:'');ENT.splice(i,1);rgSave();flash='Taxa de '+n+' removida.';render()}
function rxSet(i,k,v){RX[i][k]=['v','min','max'].includes(k)?(+v||0):k==='on'?v:v;rgSave();flash='Regra “'+RX[i].n+'” atualizada. Orçamentos pendentes recalculados.';render()}
function rxAdd(){RX.push({n:'Nova regra',t:'fixo',v:0,sv:'',fm:'',min:0,max:0,dia:'',on:true});rgSave();flash='Regra criada. Dê um nome, escolha quando vale e o valor.';render()}
let RXDEL=-1;function rxDel(i){if(RXDEL!==i){RXDEL=i;flash='Clique de novo em “Confirmar” para excluir a regra.';render();return}RXDEL=-1;const n=RX[i].n;RX.splice(i,1);rgSave();flash='Regra “'+n+'” excluída.';render()}
function vRegras(){const opt=(o,cur)=>Object.entries(o).map(([k,v])=>`<option value="${k}" ${cur===k?'selected':''}>${v}</option>`).join('');
const svO=Object.assign({'':'Todos os serviços'},Object.fromEntries(Object.entries(SVN)));
const esc=s=>String(s).replace(/"/g,'&quot;');
const apl=r=>PED.filter(p=>p.st!=='incompleto'&&rxOk(r,p)).map(p=>p.id);
return `<h2>Regras do orçamento</h2><div class="alert a-info">Valores de exemplo. O Franklin define tudo aqui, e o sistema aplica em cada pedido. Mudou uma regra, os orçamentos ainda não enviados são recalculados na hora.</div>
<div class="card"><h3>Regras gerais</h3>${RGL.map(r=>`<div class="tot" style="align-items:center;padding:8px 0;border-bottom:1px solid #F0EAE0"><span>${r[1]}</span><input class="pi" type="number" step="${r[2]}" value="${RG[r[0]]}" onchange="rgSet('${r[0]}',this.value)"></div>`).join('')}</div>
<div class="card"><h3>Taxas de entrega</h3><div class="sm" style="margin-bottom:8px">Cadastre quantas taxas quiser, por cidade ou por bairro. Com bairro preenchido, a taxa vale só para aquele bairro; com bairro em branco, vale para o resto da cidade. Cidades fora da lista usam a taxa de “outras cidades” das regras gerais (${brl(RG.entReg)}).</div>
<div class="tot sm" style="gap:8px;font-weight:700;color:var(--ink)"><span style="flex:1">Cidade</span><span style="flex:1">Bairro</span><span style="width:120px">Taxa (R$)</span><span style="width:78px"></span></div>
${ENT.map((e,i)=>`<div class="tot" style="align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #F0EAE0"><input value="${esc(e.c)}" style="flex:1;min-width:0" onchange="entSet(${i},'c',this.value)"><input value="${esc(e.b||'')}" placeholder="Todos os bairros" style="flex:1;min-width:0" onchange="entSet(${i},'b',this.value)"><input class="pi" type="number" step="1" value="${e.v}" style="width:120px" onchange="entSet(${i},'v',this.value)"><button class="sm" style="width:78px" onclick="entDel(${i})">Remover</button></div>`).join('')}
<button style="margin-top:10px" onclick="entAdd()">+ Nova taxa de entrega</button></div>
<div class="card"><h3>Regras personalizadas</h3><div class="sm" style="margin-bottom:10px">Crie taxas, acréscimos ou descontos que entram sozinhos no orçamento quando as condições batem. Use valor negativo para desconto.</div>
${RX.map((r,i)=>{const a=apl(r);return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;${r.on?'':'opacity:.6'}">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><input value="${esc(r.n)}" style="flex:1;min-width:220px;font-weight:600" onchange="rxSet(${i},'n',this.value)"><label class="ck" style="padding:0;white-space:nowrap"><input type="checkbox" ${r.on?'checked':''} onchange="rxSet(${i},'on',this.checked)"><span>${r.on?'Ativa':'Desligada'}</span></label><button class="sm" onclick="rxDel(${i})">${RXDEL===i?'Confirmar':'Excluir'}</button></div>
<div class="rxg" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px">
<label class="sm">Tipo<select onchange="rxSet(${i},'t',this.value)">${opt(RXT,r.t)}</select></label>
<label class="sm">Valor<input type="number" step="${r.t==='pct'?0.5:1}" value="${r.v}" onchange="rxSet(${i},'v',this.value)"></label>
<label class="sm">Serviço<select onchange="rxSet(${i},'sv',this.value)">${opt(svO,r.sv)}</select></label>
<label class="sm">Formato<select onchange="rxSet(${i},'fm',this.value)">${opt(RXF,r.fm)}</select></label>
<label class="sm">Dia do evento<select onchange="rxSet(${i},'dia',this.value)">${opt(RXD,r.dia)}</select></label>
<label class="sm">A partir de (pessoas)<input type="number" min="0" value="${r.min||''}" placeholder="sem mínimo" onchange="rxSet(${i},'min',this.value)"></label>
<label class="sm">Até (pessoas)<input type="number" min="0" value="${r.max||''}" placeholder="sem máximo" onchange="rxSet(${i},'max',this.value)"></label>
</div><div class="sm" style="margin-top:8px">${r.on&&!r.v?'Valor zerado: preencha o valor para a regra entrar nos orçamentos.':r.on?(a.length?'Aplicada agora em: '+a.join(', '):'Nenhum pedido atual se encaixa.'):'Desligada: não entra em nenhum orçamento.'}</div></div>`}).join('')}
<button onclick="rxAdd()">+ Nova regra</button></div>`}
let PD='',PSET=null;
function comandas(p){const c=calc(p),out=[],grp={};c.L.forEach(l=>{if(l.c.cm==='nao'||!l.qq)return;if(l.c.cm==='individual')out.push({setor:l.c.setor,itens:[l]});else(grp[l.c.setor]=grp[l.c.setor]||[]).push(l)});
Object.entries(grp).forEach(([s,L])=>out.push({setor:s,itens:L}));out.sort((a,b)=>SETORES.indexOf(a.setor)-SETORES.indexOf(b.setor));const n=out.length;return out.map((o,k)=>({...o,p,k:k+1,n}))}
function cmHtml(o){const p=o.p,ent=p.fm&&p.fm!=='ret',n=o.itens.length,fs=n<=2?22:n<=4?18:n<=6?15:13;
const it=o.itens.map(l=>`<div class="cmx">${fq(l.qq,l.c.un).toUpperCase()} ${uu(l.qq,l.c.un).toUpperCase()} | ${l.c.nome.toUpperCase()}</div>`).join('');
return `<div class="cmd"><table class="cmg"><tr><th>PEDIDO:</th><td>${p.id}</td><th>ENTREGA:</th><td>${ent?'SIM':'NÃO'}</td></tr>
<tr><th>CLIENTE:</th><td colspan="3">${p.cli.toUpperCase()}</td></tr>
<tr><th>TELEFONE:</th><td colspan="3">${p.tel}</td></tr>
<tr><th>HORÁRIO:</th><td>${p.hora||'—'}</td><th>DATA:</th><td>${p.data?p.data.split('-').reverse().slice(0,2).join('/'):'—'}</td></tr>
${ent?`<tr><th>LOCAL:</th><td colspan="3" class="sm2">${p.local} · ${p.cid}</td></tr>`:''}</table>
<div class="cmb" style="font-size:${fs}px"><div class="cms">${o.setor.toUpperCase()}</div>${it}${p.obs||p.nota?`<div class="cmo">OBS.: ${[p.obs,p.nota].filter(Boolean).join(' · ')}</div>`:''}</div><div class="cmk">${o.k}/${o.n}</div></div>`}
function imprimir(L){const all=L.flatMap(comandas).filter(o=>!PSET||PSET.includes(o.setor));if(!all.length){flash='Nenhuma comanda para imprimir com esse filtro.';render();return}
$('printArea').innerHTML=all.map(cmHtml).join('');setTimeout(()=>window.print(),50)}
function vProd(){const ap=PED.filter(p=>p.st==='aprovado').sort((a,b)=>a.data.localeCompare(b.data));
if(!ap.length)return `<h2>Produção</h2><div class="card sm">Nenhum evento aprovado ainda.</div>`;
const datas=[...new Set(ap.map(p=>p.data))];const sel=PD?ap.filter(p=>p.data===PD):ap;
const agg={};sel.forEach(p=>calc(p).L.forEach(l=>{agg[l.id]=(agg[l.id]||0)+l.qq}));
const st=PSET||SETORES;
const nC=sel.flatMap(comandas).filter(o=>st.includes(o.setor)).length;
return `<h2>Produção</h2>
<div class="card" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>Data</b><select onchange="PD=this.value;render()"><option value="">Todas (${ap.length} eventos)</option>${datas.map(d=>`<option value="${d}" ${PD===d?'selected':''}>${dbr(d)} (${DOW[dow(d)]})</option>`).join('')}</select>
<b style="margin-left:6px">Setores</b><span class="chips">${SETORES.map(s=>`<span class="chip tg ${st.includes(s)?'':'off'}" onclick="PSET=(PSET||SETORES.slice());PSET=PSET.includes('${s}')?PSET.filter(x=>x!=='${s}'):PSET.concat('${s}');if(PSET.length===SETORES.length)PSET=null;render()">${st.includes(s)?'✓ ':'+ '}${s}</span>`).join('')}</span>
<button class="pri" style="margin-left:auto" onclick="imprimir(PED.filter(p=>p.st==='aprovado'&&(!PD||p.data===PD)))">Imprimir comandas (${nC})</button></div>
<div class="g2"><div>${sel.map(p=>{const c=calc(p),cm=comandas(p).filter(o=>st.includes(o.setor));return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><h3>${dbr(p.data)} (${DOW[dow(p.data)]}) · ${p.hora}</h3><button onclick="imprimir([PED.find(x=>x.id==='${p.id}')])">Imprimir ${cm.length} comanda${cm.length===1?'':'s'}</button></div><div class="sm" style="margin-bottom:8px">${p.id} · ${p.cli} · ${p.motivo} · ${totp(p)} pessoas · ${{ret:'Retira no Marrom',emb:'Entrega em embalagens',comp:'Serviço completo'}[p.fm]||''}</div><table>${c.L.map(l=>`<tr><td>${l.c.nome}<div class="sm">${l.c.setor}${l.c.cm==='individual'?' · comanda individual':l.c.cm==='nao'?' · sem comanda':''}</div></td><td class="r"><b>${fq(l.qq,l.c.un)}</b> ${uu(l.qq,l.c.un)}</td></tr>`).join('')}</table>${c.sv.length?`<div class="chips" style="margin-top:8px">${c.sv.map(s=>`<span class="chip">${s[0]}</span>`).join('')}</div>`:''}</div>`}).join('')}</div>
<div><div class="card"><h3>Total para produzir</h3><div class="sm" style="margin-bottom:8px">${PD?'Eventos de '+dbr(PD):'Soma de todos os eventos aprovados'}, por setor</div>${SETORES.map(s=>{const it=Object.entries(agg).filter(([id])=>C(id).setor===s);return it.length?`<div class="sm" style="margin:10px 0 4px;font-weight:700;color:var(--ink)">${s}</div><table>${it.map(([id,q])=>`<tr><td>${C(id).nome}</td><td class="r"><b>${fq(q,C(id).un)}</b> ${uu(q,C(id).un)}</td></tr>`).join('')}</table>`:''}).join('')}</div>
<div class="card sm">As comandas saem 4 por folha A4, para recortar. O setor e o tipo de comanda de cada item são definidos na aba Catálogo e preços.</div></div></div>`}
const FZ=[['A-',0.9,'Pequena'],['A',1,'Média'],['A+',1.15,'Grande']];
function fzSet(z){document.documentElement.style.setProperty('--z',z);try{localStorage.setItem('mg_fonte',z)}catch(e){}$('fz').innerHTML=FZ.map(f=>`<button class="${f[1]==z?'on':''}" title="Letra ${f[2]}" onclick="fzSet(${f[1]})" style="font-size:${10+f[1]*3}px">${f[0]}</button>`).join('')}
fzSet((()=>{try{return +localStorage.getItem('mg_fonte')||1}catch(e){return 1}})());
render();
</script>
